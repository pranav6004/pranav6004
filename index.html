// ═══════════════════════════════════════════
// COLLISION MAP
// ═══════════════════════════════════════════
const coll = [];
function buildCollision() {
    for (let r = 0; r < ROWS; r++) {
        coll[r] = [];
        for (let c = 0; c < COLS; c++) {
            coll[r][c] = (r < 2 || r >= ROWS - 1 || c === 0 || c === COLS - 1) ? 1 : 0;
        }
    }
    for (const o of objects) {
        if (o.noBlock || o.wall) continue;
        for (let r = o.ty; r < o.ty + o.th; r++) {
            for (let c = o.tx; c < o.tx + o.tw; c++) {
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) coll[r][c] = 1;
            }
        }
    }
}

function tileAt(px, py) {
    const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return 1;
    return coll[r][c];
}

function blocked(x, y) {
    // Player hitbox: 8×6 at bottom center of sprite
    const hx = x + 4, hy = y + 10, hw = 8, hh = 5;
    return tileAt(hx, hy) || tileAt(hx + hw, hy) || tileAt(hx, hy + hh) || tileAt(hx + hw, hy + hh);
}

// ═══════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════
const particles = [];

function spawnSteam() {
    const cx = 15 * TILE + 4, cy = 14 * TILE + 2;
    particles.push({
        x: cx + Math.random() * 6 - 3,
        y: cy,
        vx: (Math.random() - 0.5) * 0.15,
        vy: -0.3 - Math.random() * 0.2,
        life: 1,
        decay: 0.008 + Math.random() * 0.006,
        size: 1 + Math.random(),
        type: 'steam'
    });
}

function spawnDust() {
    particles.push({
        x: TILE + Math.random() * (NW - 2 * TILE),
        y: 2 * TILE + Math.random() * (NH - 3 * TILE),
        vx: (Math.random() - 0.5) * 0.08,
        vy: (Math.random() - 0.5) * 0.06,
        life: 1,
        decay: 0.002 + Math.random() * 0.002,
        size: 1,
        type: 'dust'
    });
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        const a = Math.max(0, p.life);
        if (p.type === 'steam') {
            ctx.fillStyle = `rgba(200,210,220,${a * 0.5})`;
        } else {
            ctx.fillStyle = `rgba(255,240,200,${a * 0.25})`;
        }
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
    }
}

    btn.addEventListener('touchcancel', e => { touchDirs[dir] = false; btn.classList.remove('pressed'); });
});

// Click-to-interact on canvas
canvas.addEventListener('click', e => {
    if (!started || panelOpen) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = NW / rect.width, scaleY = NH / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    for (const obj of objects) {
        const ox = obj.tx * TILE, oy = obj.ty * TILE;
        const ow = obj.tw * TILE, oh = obj.th * TILE;
        if (mx >= ox && mx <= ox + ow && my >= oy && my <= oy + oh) {
            const pcx = player.x + 8, pcy = player.y + 8;
            const ocx = ox + ow / 2, ocy = oy + oh / 2;
            if (Math.hypot(pcx - ocx, pcy - ocy) < TILE * 4) {
                showPanel(obj.id);
                return;
            }
        }
    }
});

function resize() {
    const ratio = NW / NH;
    const w = window.innerWidth, h = window.innerHeight;
    if (w / h > ratio) {
        canvas.style.height = h + 'px';
        canvas.style.width = Math.floor(h * ratio) + 'px';
    } else {
        canvas.style.width = w + 'px';
        canvas.style.height = Math.floor(w / ratio) + 'px';
    }
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════
// DRAWING — ROOM
// ═══════════════════════════════════════════
function drawFloor() {
    for (let r = 2; r < ROWS - 1; r++) {
        ctx.fillStyle = r % 2 === 0 ? '#5A4236' : '#503B30';
        ctx.fillRect(TILE, r * TILE, (COLS - 2) * TILE, TILE);
        // Plank line
        ctx.fillStyle = '#3D2E24';
        ctx.fillRect(TILE, r * TILE + TILE - 1, (COLS - 2) * TILE, 1);
        // Vertical seams staggered
        const off = (r % 2) * TILE * 3;
        for (let x = TILE + off; x < (COLS - 1) * TILE; x += TILE * 6) {
            ctx.fillRect(x, r * TILE, 1, TILE - 1);
        }
    }
    // Slight grain variation
    ctx.fillStyle = 'rgba(0,0,0,0.015)';
    for (let r = 2; r < ROWS - 1; r += 3) {
        ctx.fillRect(TILE, r * TILE, (COLS - 2) * TILE, TILE);
    }
}

function drawRug() {
    const rx = 11 * TILE, ry = 7 * TILE, rw = 8 * TILE, rh = 6 * TILE;
    // Rug base
    ctx.fillStyle = '#2D1B4E';
    ctx.fillRect(rx, ry, rw, rh);
    // Outer border
    ctx.fillStyle = '#6C5CE7';
    ctx.fillRect(rx, ry, rw, 2); ctx.fillRect(rx, ry + rh - 2, rw, 2);
    ctx.fillRect(rx, ry, 2, rh); ctx.fillRect(rx + rw - 2, ry, 2, rh);
    // Inner border
    ctx.fillStyle = '#A29BFE';
    ctx.fillRect(rx + 5, ry + 5, rw - 10, 1); ctx.fillRect(rx + 5, ry + rh - 6, rw - 10, 1);
    ctx.fillRect(rx + 5, ry + 5, 1, rh - 10); ctx.fillRect(rx + rw - 6, ry + 5, 1, rh - 10);
    // Center diamond
    const cx = rx + rw / 2, cy = ry + rh / 2;
    ctx.fillStyle = '#A29BFE';
    for (let i = 0; i < 6; i++) {

function drawPlayer() {
    const x = Math.floor(player.x);
    const y = Math.floor(player.y);
    const d = player.dir;
    const walkOff = player.moving ? ((player.frame % 2) === 0 ? 0 : 1) : 0;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x + 3, y + 14, 10, 2);

    // Shoes
    ctx.fillStyle = '#1A1A2E';
    ctx.fillRect(x + 4 - walkOff, y + 13, 3, 2);
    ctx.fillRect(x + 9 + walkOff, y + 13, 3, 2);

    // Pants
    ctx.fillStyle = '#2D3436';
    ctx.fillRect(x + 4, y + 11, 3, 3);
    ctx.fillRect(x + 9, y + 11, 3, 3);

    // Body
    ctx.fillStyle = '#6C5CE7';
    ctx.fillRect(x + 3, y + 6, 10, 6);
    // Shirt accent
    ctx.fillStyle = '#A29BFE';
    ctx.fillRect(x + 6, y + 8, 4, 1);

    // Arms
    ctx.fillStyle = '#5B4EC9';
    if (d === 2) {
        ctx.fillRect(x + 1, y + 7, 2, 4);
        ctx.fillRect(x + 13, y + 8, 2, 3);
    } else if (d === 3) {
        ctx.fillRect(x + 13, y + 7, 2, 4);
        ctx.fillRect(x + 1, y + 8, 2, 3);
    } else {
        ctx.fillRect(x + 1, y + 7, 2, 4);
        ctx.fillRect(x + 13, y + 7, 2, 4);
    }

    // Head
    ctx.fillStyle = '#FFDAB9';
    ctx.fillRect(x + 4, y + 1, 8, 6);

    // Hair
    ctx.fillStyle = '#3E2723';
    ctx.fillRect(x + 3, y, 10, 3);
    if (d === 2) ctx.fillRect(x + 3, y, 3, 5);
    else if (d === 3) ctx.fillRect(x + 10, y, 3, 5);
    else {
        ctx.fillRect(x + 3, y, 1, 4);
        ctx.fillRect(x + 12, y, 1, 4);
    }

    // Eyes
    ctx.fillStyle = '#2D3436';
    if (d === 0) { // down
        ctx.fillRect(x + 5, y + 3, 2, 2);
        ctx.fillRect(x + 9, y + 3, 2, 2);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x + 5, y + 3, 1, 1);
        ctx.fillRect(x + 9, y + 3, 1, 1);
    } else if (d === 2) { // left
        ctx.fillRect(x + 5, y + 3, 2, 2);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x + 5, y + 3, 1, 1);
    } else if (d === 3) { // right
        ctx.fillRect(x + 9, y + 3, 2, 2);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x + 9, y + 3, 1, 1);
    }
    // dir === 1 (up): no eyes visible
}

function drawBubble(text, bx, by) {
    ctx.font = '5px "Press Start 2P", monospace';
    const tw = ctx.measureText(text).width;
    const bw = tw + 8, bh = 12;
    const px = Math.floor(bx - bw / 2);
    const py = Math.floor(by - bh - 6);

    // Bubble bg
    ctx.fillStyle = '#FFF';
    ctx.fillRect(px, py, bw, bh);
    // Border
    ctx.fillStyle = '#2D3436';
    ctx.fillRect(px - 1, py, 1, bh);
    ctx.fillRect(px + bw, py, 1, bh);
    ctx.fillRect(px, py - 1, bw, 1);
    ctx.fillRect(px, py + bh, bw, 1);
    // Arrow
    ctx.fillStyle = '#FFF';
    ctx.fillRect(Math.floor(bx) - 2, py + bh, 4, 3);
    ctx.fillStyle = '#2D3436';
    ctx.fillRect(Math.floor(bx) - 3, py + bh, 1, 2);
    ctx.fillRect(Math.floor(bx) + 2, py + bh, 1, 2);
    ctx.fillRect(Math.floor(bx) - 2, py + bh + 2, 1, 1);
    ctx.fillRect(Math.floor(bx) + 1, py + bh + 2, 1, 1);

    // Text
    ctx.fillStyle = '#2D3436';
    ctx.fillText(text, px + 4, py + 8);
}

function drawVignette() {
    const grd = ctx.createRadialGradient(NW / 2, NH / 2, NW * 0.3, NW / 2, NH / 2, NW * 0.75);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, NW, NH);
}

function drawMonitorGlow(t) {
    const dx = 3 * TILE + 16, dy = 4 * TILE - 2;
    const pulse = 0.06 + Math.sin(t * 2) * 0.02;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = `rgba(9,132,227,${pulse * (1 - i * 0.25)})`;
        ctx.fillRect(dx + 18 - i * 8, dy - i * 6, 32 + i * 16, 18 + i * 12);
    }
    ctx.globalCompositeOperation = 'source-over';
}

function drawLampGlow(t) {
    const lx = 3 * TILE + 78, ly = 4 * TILE - 12;
    const pulse = 0.05 + Math.sin(t * 1.5) * 0.015;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
        ctx.fillStyle = `rgba(240,165,0,${pulse * (1 - i * 0.3)})`;
        ctx.fillRect(lx - 4 - i * 6, ly - i * 4, 18 + i * 12, 12 + i * 8);
    }
    ctx.globalCompositeOperation = 'source-over';
}

// ═══════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════
function checkProximity() {
    nearObj = null;
    const pcx = player.x + 8, pcy = player.y + 8;
    let minDist = Infinity;
    for (const obj of objects) {
        const ocx = (obj.tx + obj.tw / 2) * TILE;
        const ocy = (obj.ty + obj.th / 2) * TILE;
        const dist = Math.hypot(pcx - ocx, pcy - ocy);
        const threshold = obj.wall ? TILE * 3 : TILE * 2.5;
        if (dist < threshold && dist < minDist) {
            minDist = dist;
            nearObj = obj;
        }
    }
}

function interact() {
    if (!started || panelOpen) return;
    if (nearObj) showPanel(nearObj.id);
}

function showPanel(id) {
    const data = infoData[id];
    if (!data) return;
    const panel = document.getElementById('panel-content');
    panel.innerHTML = '<h2>' + data.title + '</h2>' + data.html;
    document.getElementById('info-panel').classList.add('open');
    panelOpen = true;
}

window.closePanel = function() {
    document.getElementById('info-panel').classList.remove('open');
    panelOpen = false;
};

window.startGame = function() {
    document.getElementById('instructions').style.display = 'none';
    started = true;
};

// ═══════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════
let steamTimer = 0, dustTimer = 0;

function update(dt) {
    // Player movement
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA || touchDirs.left) dx = -1;
    if (keys.ArrowRight || keys.KeyD || touchDirs.right) dx = 1;
    if (keys.ArrowUp || keys.KeyW || touchDirs.up) dy = -1;
    if (keys.ArrowDown || keys.KeyS || touchDirs.down) dy = 1;

    if (dx && dy) { dx *= 0.707; dy *= 0.707; }

    const spd = player.speed * dt;
    const nx = player.x + dx * spd;
    const ny = player.y + dy * spd;

    if (dx !== 0 && !blocked(nx, player.y)) player.x = nx;
    if (dy !== 0 && !blocked(player.x, ny)) player.y = ny;

    // Direction
    if (dx < 0) player.dir = 2;
    else if (dx > 0) player.dir = 3;
    else if (dy < 0) player.dir = 1;
    else if (dy > 0) player.dir = 0;

    // Walk animation
    player.moving = (dx !== 0 || dy !== 0);
    if (player.moving) {
        player.frameTimer += dt;
        if (player.frameTimer > 8) {
            player.frameTimer = 0;
            player.frame = (player.frame + 1) % 4;
        }
    } else {
        player.frame = 0;
        player.frameTimer = 0;
    }

    // Proximity
    checkProximity();

    // Particles
    steamTimer += dt;
    if (steamTimer > 6) { steamTimer = 0; spawnSteam(); }
    dustTimer += dt;
    if (dustTimer > 30) { dustTimer = 0; spawnDust(); }
    updateParticles(dt);

    gameTime += dt * 0.016;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
    // Background
    ctx.fillStyle = '#0A0A14';
    ctx.fillRect(0, 0, NW, NH);

    drawFloor();
    drawRug();
    drawWalls();
    drawWallObjects(gameTime);

    // Depth-sorted floor entities
    const entities = [];
    for (const obj of objects) {
        if (obj.wall) continue;
        entities.push({ y: (obj.ty + obj.th) * TILE, fn: () => drawFloorObject(obj, gameTime) });
    }
    entities.push({ y: player.y + 16, fn: drawPlayer });
    entities.sort((a, b) => a.y - b.y);
    for (const e of entities) e.fn();

    // Ambient lighting
    drawMonitorGlow(gameTime);
    drawLampGlow(gameTime);

    // Particles
    drawParticles();

    // UI bubble
    if (nearObj && !panelOpen) {
        const ox = (nearObj.tx + nearObj.tw / 2) * TILE;
        const oy = nearObj.ty * TILE;
        drawBubble('Press E', ox, oy);
    }

    // Vignette
    drawVignette();
}

// ═══════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════
let lastTime = 0;
function loop(timestamp) {
    const rawDt = timestamp - lastTime;
    lastTime = timestamp;
    const dt = Math.min(rawDt / 16.667, 3); // normalize to ~60fps frames

    if (started && !panelOpen) update(dt);
    render();
    requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init() {
    buildCollision();
    resize();
    // Seed initial dust particles
    for (let i = 0; i < 6; i++) spawnDust();
    requestAnimationFrame(loop);
}

document.fonts.ready.then(init);

})();
</script>
</body>
</html>
