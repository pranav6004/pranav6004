<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel-font { font-family: 'Press Start 2P', monospace; }
      
      @keyframes monitor-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float-dust {
        0% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(5px, -3px); opacity: 0.6; }
        50% { transform: translate(10px, 0); opacity: 0.3; }
        75% { transform: translate(5px, 3px); opacity: 0.6; }
        100% { transform: translate(0, 0); opacity: 0.3; }
      }
      @keyframes steam {
        0% { transform: translateY(0); opacity: 0.5; }
        100% { transform: translateY(-12px); opacity: 0; }
      }
      @keyframes walk {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes cat-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.95); }
      }
      @keyframes lamp-pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.25; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0A0A14"/>

  <!-- Floor -->
  <rect x="30" y="55" width="740" height="120" fill="#5A4236" rx="2"/>
  <!-- Floor plank lines -->
  <line x1="30" y1="75" x2="770" y2="75" stroke="#3D2E24" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="95" x2="770" y2="95" stroke="#3D2E24" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="115" x2="770" y2="115" stroke="#3D2E24" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="135" x2="770" y2="135" stroke="#3D2E24" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="155" x2="770" y2="155" stroke="#3D2E24" stroke-width="1" opacity="0.5"/>

  <!-- Top Wall -->
  <rect x="0" y="0" width="800" height="58" fill="#16213E"/>
  <rect x="0" y="0" width="800" height="4" fill="#0F0F23"/>
  <!-- Baseboard -->
  <rect x="30" y="55" width="740" height="4" fill="#3D3028"/>

  <!-- Side Walls -->
  <rect x="0" y="0" width="32" height="200" fill="#16213E"/>
  <rect x="768" y="0" width="32" height="200" fill="#16213E"/>
  
  <!-- Bottom Wall -->
  <rect x="0" y="173" width="800" height="27" fill="#16213E"/>
  <rect x="30" y="173" width="740" height="3" fill="#3D3028"/>

  <!-- Rug -->
  <rect x="320" y="80" width="160" height="80" fill="#2D1B4E" rx="1"/>
  <rect x="320" y="80" width="160" height="3" fill="#6C5CE7"/>
  <rect x="320" y="157" width="160" height="3" fill="#6C5CE7"/>
  <rect x="320" y="80" width="3" height="80" fill="#6C5CE7"/>
  <rect x="477" y="80" width="3" height="80" fill="#6C5CE7"/>

  <!-- Poster on wall -->
  <rect x="80" y="10" width="55" height="40" fill="#5D4E37"/>
  <rect x="83" y="13" width="49" height="34" fill="#1A1A2E"/>
  <rect x="88" y="18" width="12" height="12" fill="#6C5CE7"/>
  <rect x="103" y="20" width="14" height="8" fill="#E17055"/>
  <rect x="90" y="32" width="18" height="8" fill="#00B894"/>
  <rect x="115" y="16" width="8" height="8" fill="#FDCB6E"/>

  <!-- Bookshelf -->
  <rect x="300" y="8" width="120" height="44" fill="#3E2723"/>
  <rect x="300" y="28" width="120" height="3" fill="#5D4E37"/>
  <rect x="300" y="48" width="120" height="3" fill="#5D4E37"/>
  <!-- Books top row -->
  <rect x="305" y="14" width="5" height="14" fill="#E17055"/>
  <rect x="312" y="16" width="6" height="12" fill="#0984E3"/>
  <rect x="320" y="12" width="5" height="16" fill="#00B894"/>
  <rect x="327" y="15" width="6" height="13" fill="#FDCB6E"/>
  <rect x="335" y="13" width="5" height="15" fill="#6C5CE7"/>
  <rect x="342" y="16" width="6" height="12" fill="#E84393"/>
  <rect x="350" y="14" width="5" height="14" fill="#FD79A8"/>
  <rect x="357" y="12" width="6" height="16" fill="#74B9FF"/>
  <rect x="365" y="15" width="5" height="13" fill="#A29BFE"/>
  <rect x="372" y="13" width="6" height="15" fill="#E17055"/>
  <rect x="380" y="16" width="5" height="12" fill="#0984E3"/>
  <rect x="387" y="14" width="6" height="14" fill="#00B894"/>
  <rect x="395" y="12" width="5" height="16" fill="#FDCB6E"/>
  <rect x="402" y="15" width="6" height="13" fill="#6C5CE7"/>
  <!-- Books bottom row -->
  <rect x="305" y="34" width="6" height="14" fill="#A29BFE"/>
  <rect x="313" y="36" width="5" height="12" fill="#FDCB6E"/>
  <rect x="320" y="33" width="6" height="15" fill="#E17055"/>
  <rect x="328" y="35" width="5" height="13" fill="#74B9FF"/>
  <rect x="335" y="32" width="6" height="16" fill="#00B894"/>
  <rect x="343" y="36" width="5" height="12" fill="#6C5CE7"/>
  <rect x="350" y="34" width="6" height="14" fill="#E84393"/>
  <rect x="358" y="33" width="5" height="15" fill="#0984E3"/>

  <!-- Trophy shelf -->
  <rect x="620" y="10" width="80" height="42" fill="#3E2723"/>
  <rect x="620" y="30" width="80" height="3" fill="#5D4E37"/>
  <rect x="620" y="48" width="80" height="3" fill="#5D4E37"/>
  <!-- Trophy cup -->
  <rect x="636" y="16" width="12" height="14" fill="#F9CA24"/>
  <rect x="634" y="16" width="16" height="4" fill="#F9CA24"/>
  <rect x="640" y="28" width="4" height="2" fill="#636E72"/>
  <!-- Star -->
  <rect x="670" y="35" width="10" height="10" fill="#F9CA24"/>
  <rect x="672" y="37" width="6" height="6" fill="#E17055"/>
  <!-- Medal -->
  <rect x="685" y="18" width="10" height="10" fill="#A29BFE"/>
  <rect x="687" y="20" width="6" height="6" fill="#6C5CE7"/>

  <!-- Desk -->
  <rect x="55" y="85" width="140" height="40" fill="#5D4E37"/>
  <rect x="55" y="85" width="140" height="3" fill="#4A3E2E"/>
  <!-- Monitor -->
  <rect x="80" y="60" width="50" height="30" fill="#2D3436"/>
  <rect x="83" y="63" width="44" height="24" fill="#0984E3" style="animation: monitor-glow 3s ease-in-out infinite"/>
  <!-- Code lines on monitor -->
  <rect x="87" y="67" width="20" height="2" fill="#74B9FF"/>
  <rect x="89" y="71" width="14" height="2" fill="#A29BFE"/>
  <rect x="87" y="75" width="26" height="2" fill="#00B894"/>
  <rect x="89" y="79" width="12" height="2" fill="#FDCB6E"/>
  <!-- Cursor -->
  <rect x="101" y="79" width="3" height="3" fill="#FFF" style="animation: cursor-blink 1s step-end infinite"/>
  <!-- Keyboard -->
  <rect x="88" y="92" width="34" height="12" fill="#2D3436"/>
  <!-- Lamp -->
  <rect x="168" y="72" width="3" height="16" fill="#636E72"/>
  <rect x="162" y="66" width="16" height="8" fill="#F0A500"/>
  <!-- Lamp glow -->
  <circle cx="170" cy="70" r="25" fill="#F0A500" opacity="0.15" style="animation: lamp-pulse 2s ease-in-out infinite"/>
  <!-- Monitor glow -->
  <circle cx="105" cy="77" r="35" fill="#0984E3" opacity="0.08" style="animation: lamp-pulse 3s ease-in-out infinite"/>

  <!-- Game Console -->
  <rect x="610" y="90" width="50" height="26" fill="#2D3436"/>
  <rect x="614" y="94" width="42" height="18" fill="#2D8B4E" style="animation: monitor-glow 2s ease-in-out infinite"/>
  <rect x="620" y="120" width="36" height="14" fill="#1A1A2E"/>
  <!-- LED -->
  <circle cx="628" cy="127" r="2" fill="#00E676" style="animation: cursor-blink 2s step-end infinite"/>

  <!-- Coffee table -->
  <rect x="370" y="140" width="80" height="25" fill="#795548"/>
  <!-- Cup -->
  <rect x="382" y="143" width="10" height="12" fill="#DFE6E9"/>
  <rect x="383" y="144" width="8" height="5" fill="#5D4037"/>
  <!-- Steam -->
  <rect x="385" y="138" width="2" height="4" fill="#DFE6E9" opacity="0.4" style="animation: steam 2s ease-out infinite"/>
  <rect x="389" y="139" width="2" height="3" fill="#DFE6E9" opacity="0.3" style="animation: steam 2s ease-out 0.5s infinite"/>
  <!-- Notebook -->
  <rect x="410" y="144" width="18" height="14" fill="#FAD390"/>
  <line x1="413" y1="148" x2="423" y2="148" stroke="#3E2723" stroke-width="1"/>
  <line x1="413" y1="151" x2="420" y2="151" stroke="#3E2723" stroke-width="1"/>

  <!-- Whiteboard -->
  <rect x="50" y="135" width="90" height="32" fill="#636E72"/>
  <rect x="53" y="137" width="84" height="28" fill="#DFE6E9"/>
  <line x1="58" y1="143" x2="80" y2="143" stroke="#E17055" stroke-width="1.5"/>
  <line x1="58" y1="148" x2="72" y2="148" stroke="#0984E3" stroke-width="1.5"/>
  <rect x="90" y="141" width="10" height="10" fill="#00B894" opacity="0.7"/>

  <!-- Camera -->
  <rect x="680" y="130" width="36" height="20" fill="#2D3436"/>
  <rect x="684" y="134" width="28" height="12" fill="#1A1A2E"/>
  <circle cx="698" cy="140" r="6" fill="#636E72"/>
  <circle cx="698" cy="140" r="4" fill="#0984E3"/>
  <circle cx="698" cy="140" r="2" fill="#74B9FF"/>

  <!-- Plant -->
  <rect x="730" y="145" width="24" height="22" fill="#A1552A"/>
  <rect x="728" y="143" width="28" height="4" fill="#C0662F"/>
  <rect x="738" y="120" width="3" height="24" fill="#1B7A42"/>
  <rect x="732" y="116" width="12" height="10" fill="#00B894"/>
  <rect x="744" y="112" width="10" height="10" fill="#00B894"/>
  <rect x="734" y="118" width="6" height="4" fill="#00D2A0"/>

  <!-- Player character -->
  <g style="animation: walk 1.5s ease-in-out infinite" transform="translate(380, 95)">
    <!-- Shadow -->
    <ellipse cx="8" cy="28" rx="7" ry="2" fill="rgba(0,0,0,0.25)"/>
    <!-- Shoes -->
    <rect x="3" y="24" width="4" height="3" fill="#1A1A2E"/>
    <rect x="9" y="24" width="4" height="3" fill="#1A1A2E"/>
    <!-- Pants -->
    <rect x="3" y="21" width="4" height="4" fill="#2D3436"/>
    <rect x="9" y="21" width="4" height="4" fill="#2D3436"/>
    <!-- Body -->
    <rect x="2" y="13" width="12" height="9" fill="#6C5CE7"/>
    <rect x="5" y="16" width="6" height="2" fill="#A29BFE"/>
    <!-- Arms -->
    <rect x="0" y="14" width="3" height="6" fill="#5B4EC9"/>
    <rect x="13" y="14" width="3" height="6" fill="#5B4EC9"/>
    <!-- Head -->
    <rect x="3" y="3" width="10" height="10" fill="#FFDAB9"/>
    <!-- Hair -->
    <rect x="2" y="1" width="12" height="5" fill="#3E2723"/>
    <rect x="2" y="1" width="2" height="7" fill="#3E2723"/>
    <rect x="12" y="1" width="2" height="7" fill="#3E2723"/>
    <!-- Eyes -->
    <rect x="5" y="6" width="2" height="3" fill="#2D3436"/>
    <rect x="9" y="6" width="2" height="3" fill="#2D3436"/>
    <rect x="5" y="6" width="1" height="1" fill="#FFF"/>
    <rect x="9" y="6" width="1" height="1" fill="#FFF"/>
  </g>

  <!-- Cat on rug -->
  <g transform="translate(420, 108)" style="animation: cat-breathe 3s ease-in-out infinite; transform-origin: center bottom;">
    <rect x="4" y="6" width="18" height="10" fill="#E17055" rx="2"/>
    <rect x="20" y="4" width="12" height="10" fill="#E17055" rx="1"/>
    <!-- Ears -->
    <rect x="21" y="1" width="4" height="4" fill="#D63031"/>
    <rect x="27" y="1" width="4" height="4" fill="#D63031"/>
    <!-- Eyes closed -->
    <line x1="23" y1="8" x2="25" y2="8" stroke="#2D3436" stroke-width="1.5"/>
    <line x1="28" y1="8" x2="30" y2="8" stroke="#2D3436" stroke-width="1.5"/>
    <!-- Tail -->
    <rect x="0" y="8" width="6" height="3" fill="#D63031" rx="1"/>
  </g>

  <!-- Dust particles -->
  <circle cx="260" cy="100" r="1.5" fill="#FFE4B5" opacity="0.3" style="animation: float-dust 6s ease-in-out infinite"/>
  <circle cx="520" cy="85" r="1" fill="#FFE4B5" opacity="0.2" style="animation: float-dust 8s ease-in-out 1s infinite"/>
  <circle cx="580" cy="130" r="1.5" fill="#FFE4B5" opacity="0.25" style="animation: float-dust 7s ease-in-out 2s infinite"/>
  <circle cx="200" cy="140" r="1" fill="#FFE4B5" opacity="0.3" style="animation: float-dust 9s ease-in-out 3s infinite"/>
  <circle cx="460" cy="75" r="1" fill="#FFE4B5" opacity="0.2" style="animation: float-dust 5s ease-in-out 0.5s infinite"/>

  <!-- Vignette overlay -->
  <rect width="800" height="200" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </radialGradient>
  </defs>

  <!-- Title text -->
  <text x="400" y="192" text-anchor="middle" fill="#6C5CE7" font-size="7" class="pixel-font" opacity="0.6">
    ▶ CLICK TO ENTER MY ROOM ◀
  </text>
</svg>
